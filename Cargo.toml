[workspace]
members = ["crates/squin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/QuEraComputing/bloqade-circuit"

[workspace.dependencies]
kirin = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2" }
kirin-arith = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2" }
kirin-cmp = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2" }
kirin-constant = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2" }
kirin-function = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2" }
kirin-interpreter = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2", features = ["derive"] }
kirin-scf = { git = "https://github.com/QuEraComputing/kirin.git", rev = "2958d85ddcd8c98a5e11c7c5e0e621e1730211e2" }
smallvec = "1.13"
thiserror = "2"
